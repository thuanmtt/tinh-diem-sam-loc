<!DOCTYPE html>
<html lang="vi">

<head>
    <title>Tính Điểm</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="https://avatars.githubusercontent.com/u/86670683">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-GFJ44VE67C"></script>
    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }

        gtag('js', new Date());
        gtag('config', 'G-GFJ44VE67C');
    </script>
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --accent-color: #ff477e;
            --success-color: #4ade80;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --info-color: #0ea5e9;
            --background-color: #f8f9fa;
            --text-color: #333;
            --card-bg: #ffffff;
            --card-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --border-radius: 12px;
            --transition: all 0.3s ease;
        }

        body.dark-mode {
            --primary-color: #6366f1;
            --secondary-color: #818cf8;
            --accent-color: #ff6b99;
            --background-color: #1e293b;
            --text-color: #e2e8f0;
            --card-bg: #2a3547;
            --card-shadow: 0 4px 6px rgba(0, 0, 0, 0.4);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            background-color: var(--background-color);
            color: var(--text-color);
            transition: var(--transition);
            min-height: 100vh;
            padding: 20px 0;
        }

        .app-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 30px;
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
            position: relative;
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eaeaea;
        }

        body.dark-mode .app-header {
            border-bottom-color: #3a4556;
        }

        .app-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin: 0;
            color: var(--primary-color);
        }

        /* Form Styling */
        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--text-color);
        }

        .form-control {
            height: 52px;
            border-radius: 10px;
            padding: 10px 15px;
            font-size: 1rem;
            border: 2px solid #e0e0e0;
            transition: var(--transition);
            background-color: var(--card-bg);
            color: var(--text-color);
        }

        body.dark-mode .form-control {
            border-color: #4b5563;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }

        body.dark-mode .form-control:focus {
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
        }

        .input-help-text {
            display: block;
            margin-top: 8px;
            font-size: 0.85rem;
            color: #666;
        }

        body.dark-mode .input-help-text {
            color: #a1a1aa;
        }

        /* Button Styling */
        .btn {
            font-weight: 600;
            height: 52px;
            padding: 10px 25px;
            border-radius: 10px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .btn-primary:hover {
            background-color: var(--secondary-color);
            border-color: var(--secondary-color);
        }

        .btn-danger {
            background-color: var(--danger-color);
            border-color: var(--danger-color);
        }

        .btn-warning {
            background-color: var(--warning-color);
            border-color: var(--warning-color);
        }

        .btn-info {
            background-color: var(--info-color);
            border-color: var(--info-color);
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 30px;
        }

        .btn-group .btn {
            flex: 1;
            min-width: 120px;
        }

        /* Table Styling */
        .player-table {
            width: 100%;
            margin-top: 30px;
            border-collapse: separate;
            border-spacing: 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .player-table thead {
            background-color: var(--primary-color);
            color: white;
        }

        .player-table th {
            padding: 15px;
            font-weight: 600;
            text-align: left;
        }

        .player-table tbody tr {
            background-color: var(--card-bg);
            transition: var(--transition);
        }

        .player-table tbody tr:hover {
            background-color: rgba(67, 97, 238, 0.05);
        }

        body.dark-mode .player-table tbody tr:hover {
            background-color: rgba(99, 102, 241, 0.1);
        }

        .player-table td {
            padding: 15px;
            border-top: 1px solid #eaeaea;
        }

        body.dark-mode .player-table td {
            border-top-color: #3a4556;
        }

        /* Positive and negative score styling */
        .positive-score {
            color: var(--success-color);
            font-weight: 600;
        }

        .negative-score {
            color: var(--danger-color);
            font-weight: 600;
        }

        /* Dark mode toggle */
        .theme-toggle {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.5rem;
            color: var(--text-color);
            padding: 5px;
            border-radius: 50%;
            transition: var(--transition);
        }

        .theme-toggle:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        body.dark-mode .theme-toggle:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Divider */
        .divider {
            margin: 30px 0;
            height: 1px;
            background-color: #e0e0e0;
        }

        body.dark-mode .divider {
            background-color: #4b5563;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.3s ease forwards;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .app-container {
                padding: 20px;
                margin: 10px;
                border-radius: 8px;
            }

            .app-title {
                font-size: 1.8rem;
            }

            .btn-group {
                flex-direction: column;
            }

            .btn-group .btn {
                width: 100%;
            }
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 40px 0;
            color: #666;
        }

        body.dark-mode .empty-state {
            color: #a1a1aa;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #ccc;
        }

        body.dark-mode .empty-state i {
            color: #4b5563;
        }

        /* History Modal */
        .history-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 1px solid #eaeaea;
        }

        body.dark-mode .history-toolbar {
            border-bottom-color: #3a4556;
        }

        .history-stats {
            font-size: 0.9rem;
            color: #6b7280;
            text-align: left;
        }

        body.dark-mode .history-stats {
            color: #94a3b8;
        }

        .history-stats strong {
            color: var(--primary-color);
            font-weight: 700;
            font-size: 1rem;
        }

        .history-sort-group {
            display: inline-flex;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--primary-color);
        }

        .history-sort-group button {
            background: transparent;
            color: var(--primary-color);
            border: none;
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .history-sort-group button.active,
        .history-sort-group button:hover {
            background: var(--primary-color);
            color: #fff;
        }

        .history-table-wrapper {
            max-height: 55vh;
            overflow: auto;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background: var(--card-bg);
        }

        body.dark-mode .history-table-wrapper {
            border-color: #3a4556;
        }

        .history-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.95rem;
            margin: 0;
        }

        .history-table thead th {
            position: sticky;
            top: 0;
            z-index: 3;
            background: var(--primary-color);
            color: #fff;
            font-weight: 600;
            padding: 12px 10px;
            text-align: center;
            white-space: nowrap;
            border-bottom: 2px solid var(--secondary-color);
        }

        .history-table thead th.col-stt {
            width: 56px;
        }

        .history-table thead th.col-time {
            text-align: left;
            min-width: 110px;
        }

        .history-table tbody td {
            padding: 10px 12px;
            border-top: 1px solid #eaeaea;
            text-align: center;
            vertical-align: middle;
        }

        body.dark-mode .history-table tbody td {
            border-top-color: #3a4556;
        }

        .history-table tbody tr:nth-child(even) td {
            background-color: rgba(0, 0, 0, 0.02);
        }

        body.dark-mode .history-table tbody tr:nth-child(even) td {
            background-color: rgba(255, 255, 255, 0.03);
        }

        .history-table tbody tr:hover td {
            background-color: rgba(67, 97, 238, 0.08);
        }

        body.dark-mode .history-table tbody tr:hover td {
            background-color: rgba(99, 102, 241, 0.15);
        }

        .history-table .col-stt {
            font-weight: 600;
            color: #6b7280;
        }

        body.dark-mode .history-table .col-stt {
            color: #94a3b8;
        }

        .history-table .col-time {
            text-align: left;
            white-space: nowrap;
            color: #6b7280;
            font-size: 0.85rem;
            font-variant-numeric: tabular-nums;
        }

        body.dark-mode .history-table .col-time {
            color: #94a3b8;
        }

        .history-table .score-cell {
            font-variant-numeric: tabular-nums;
            font-weight: 600;
        }

        .history-table .score-positive {
            color: var(--success-color);
        }

        .history-table .score-negative {
            color: var(--danger-color);
        }

        .history-table .score-zero {
            color: #9ca3af;
        }

        .history-table .score-empty {
            color: #cbd5e1;
            font-weight: 400;
        }

        body.dark-mode .history-table .score-empty {
            color: #475569;
        }

        .history-table .winner-cell {
            background-color: rgba(74, 222, 128, 0.18) !important;
            position: relative;
        }

        .history-table .winner-cell::after {
            content: "\f521";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            font-size: 0.7rem;
            color: var(--warning-color);
            margin-left: 4px;
            vertical-align: middle;
        }

        .history-total-row td {
            position: sticky;
            top: 46px;
            z-index: 2;
            background-color: #eef2ff !important;
            font-weight: 700;
            border-bottom: 2px solid var(--primary-color);
        }

        body.dark-mode .history-total-row td {
            background-color: #2a3142 !important;
        }

        .history-total-row .total-label {
            color: var(--primary-color);
            text-align: left;
            letter-spacing: 0.4px;
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .history-actions {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-top: 16px;
        }

        .history-actions .btn {
            height: auto;
            padding: 8px 18px;
            font-size: 0.9rem;
            border-radius: 8px;
        }

        @media (max-width: 600px) {
            .history-toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .history-sort-group {
                align-self: flex-end;
            }

            .history-table {
                font-size: 0.85rem;
            }

            .history-table thead th,
            .history-table tbody td {
                padding: 8px 6px;
            }

            .history-table .col-time {
                font-size: 0.75rem;
                min-width: 90px;
            }

            .history-total-row td {
                top: 42px;
            }
        }
    </style>
</head>

<body>
<div class="container">
    <div class="app-container fade-in">
        <div class="app-header">
            <h1 class="app-title">Tính Điểm</h1>
            <button id="dark-mode-toggle" class="theme-toggle">
                <i class="fas fa-moon"></i>
            </button>
        </div>

        <form id="player-form">
            <div class="form-group">
                <label for="player-name">Nhập Tên Người Chơi:</label>
                <div class="input-group">
                    <input type="text" class="form-control" id="player-name" placeholder="Tên người chơi">
                    <button type="submit" id="add-player" class="btn btn-primary">
                        <i class="fas fa-user-plus"></i> Thêm
                    </button>
                </div>
            </div>
        </form>

        <div class="divider"></div>

        <form id="score-form">
            <div class="form-group">
                <label>Nhập Điểm: <i id="score-help-icon" class="fas fa-question-circle text-primary"
                                     style="cursor: pointer; margin-left: 5px;"></i></label>
                <div class="input-group">
                    <input type="text" class="form-control" id="score-input" placeholder="1,-,7,5,6">
                    <button type="submit" id="add-scores" class="btn btn-primary">
                        <i class="fas fa-plus-circle"></i> Thêm
                    </button>
                </div>
                <!--                <span class="input-help-text">-->
                <!--                        <i class="fas fa-info-circle"></i> Nếu điểm là dấu gạch ngang (-), điểm của người chơi sẽ là tổng điểm của tất cả các người chơi còn lại-->
                <!--                    </span>-->
            </div>
        </form>

        <div class="divider"></div>

        <table class="player-table" id="player-table">
            <thead>
            <tr>
                <th width="60%">Tên Người Chơi</th>
                <th width="40%">Tổng Điểm</th>
            </tr>
            </thead>
            <tbody id="score-table">
            <!-- Dữ liệu sẽ được thêm bằng JavaScript -->
            </tbody>
        </table>

        <div id="empty-state" class="empty-state">
            <i class="fas fa-users"></i>
            <p>Chưa có người chơi nào. Vui lòng thêm người chơi để bắt đầu.</p>
        </div>

        <div class="btn-group">
            <button id="history-button" class="btn btn-info">
                <i class="fas fa-history"></i> Xem Lịch Sử
            </button>
            <button id="share-button" class="btn btn-success">
                <i class="fas fa-share-alt"></i> Chia Sẻ
            </button>
            <button id="split-button" class="btn btn-warning">
                <i class="fas fa-hand-holding-usd"></i> Chia Tiền
            </button>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
    $(function () {
        // Hàm để đọc tham số từ URL
        function getParameterByName(name, url = window.location.href) {
            name = name.replace(/[\[\]]/g, '\\$&');
            var regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)'),
                results = regex.exec(url);
            if (!results) return null;
            if (!results[2]) return '';
            return decodeURIComponent(results[2].replace(/\+/g, ' '));
        }

        // Chạy khi trang đã tải xong
        $(document).ready(function () {
            // Kiểm tra xem có dữ liệu được chia sẻ qua URL không
            const sharedData = getParameterByName('data');
            if (sharedData) {
                try {
                    // Giải nén dữ liệu từ LZString
                    const jsonData = LZString.decompressFromEncodedURIComponent(sharedData);
                    // Parse JSON thành đối tượng JavaScript
                    const parsedData = JSON.parse(jsonData);

                    if (parsedData.players && parsedData.matches) {
                        // Gán dữ liệu được chia sẻ
                        players = parsedData.players;
                        matches = parsedData.matches;

                        // Lưu vào localStorage
                        localStorage.setItem('players', JSON.stringify(players));
                        localStorage.setItem('matches', JSON.stringify(matches));

                        // Cập nhật giao diện
                        renderTable();

                        // Thông báo thành công
                        Swal.fire(
                            'Đã tải thành công!',
                            'Dữ liệu được chia sẻ đã được tải.',
                            'success'
                        );
                    }
                } catch (e) {
                    console.error('Lỗi khi xử lý dữ liệu được chia sẻ:', e);
                    Swal.fire({
                        title: 'Lỗi!',
                        text: 'Dữ liệu chia sẻ không hợp lệ hoặc bị hỏng.',
                        icon: 'error'
                    });
                }
            }
        });

        // Khởi tạo dữ liệu từ localStorage
        var players = JSON.parse(localStorage.getItem('players')) || [];
        var matches = JSON.parse(localStorage.getItem('matches')) || [];

        // Hiển thị bảng điểm
        renderTable();

        // Xử lý thêm người chơi mới
        $('#player-form').submit(function (event) {
            event.preventDefault();
            var playerName = $('#player-name').val().trim();
            if (playerName) {
                players.push({
                    name: playerName,
                    score: 0
                });
                localStorage.setItem('players', JSON.stringify(players));
                renderTable();
                $('#player-name').val('');
            } else {
                Swal.fire({
                    title: 'Lỗi!',
                    text: 'Vui lòng nhập tên người chơi',
                    icon: 'error'
                });
            }
        });

        // Xử lý hiển thị hướng dẫn nhập điểm
        $('#score-help-icon').click(function () {
            Swal.fire({
                title: 'Hướng dẫn nhập điểm',
                html: `
                    <div class="text-start">
                        <p><strong>Cách nhập điểm:</strong></p>
                        <ul class="list-group mb-3">
                            <li class="list-group-item">Nhập điểm cho từng người chơi, cách nhau bởi dấu phẩy (,)</li>
                            <li class="list-group-item">Sử dụng dấu gạch ngang (-) cho người thắng cuộc</li>
                            <li class="list-group-item">Số lượng điểm phải bằng số lượng người chơi</li>
                        </ul>

                        <p><strong>Ví dụ:</strong></p>
                        <div class="alert alert-info">
                            <p class="mb-2"><strong>Giả sử có 3 người chơi: A, B, C</strong></p>
                            <p class="mb-1">• Người A thắng, B bị -5 điểm, C bị -3 điểm:</p>
                            <code>-, 5, 3</code><br><br>
                            <p class="mb-1">• Người B thắng, A bị -4 điểm, C bị -6 điểm:</p>
                            <code>4, -, 6</code>
                        </div>

                        <p><strong>Lưu ý:</strong></p>
                        <ul class="list-group">
                            <li class="list-group-item text-danger">Phải có ít nhất một dấu gạch ngang (-) để chỉ người thắng</li>
                            <li class="list-group-item">Người thắng sẽ nhận tổng điểm của những người thua</li>
                        </ul>
                    </div>
                `,
                icon: 'info',
                width: '600px'
            });
        });

        // Xử lý thêm điểm
        $('#score-form').submit(function (event) {
            event.preventDefault();
            scoreInput = $('#score-input').val();

            if (players.length === 0) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Chưa có người chơi',
                    text: 'Vui lòng thêm người chơi trước khi nhập điểm!'
                });
                return;
            }

            var scores = scoreInput.split(',');

            if (!validateInput(scoreInput)) {
                Swal.fire({
                    icon: 'error',
                    title: 'Định dạng không hợp lệ',
                    html: '1. Chỉ cho phép số, dấu phẩy và dấu gạch ngang!<br>2. Phải có ít nhất một dấu gạch ngang (-).',
                })
            } else if (scores.length !== players.length) {
                Swal.fire({
                    icon: 'error',
                    title: 'Số lượng không khớp',
                    text: 'Số điểm nhập (' + scores.length + ') không khớp với số lượng người chơi (' + players.length + ')!'
                })
            } else {
                var matchData = {
                    timestamp: new Date().getTime(),
                    players: []
                };
                for (var i = 0; i < players.length; i++) {
                    var score = scores[i].trim();
                    if (score === '-') {
                        // Tính điểm cho người chơi này là tổng điểm của tất cả người chơi khác
                        var points = sumNumericValues(scores);
                    } else {
                        var points = -parseInt(score);
                    }
                    players[i].score += points;
                    matchData.players.push({
                        name: players[i].name,
                        score: points
                    });
                }
                matches.push(matchData);
                localStorage.setItem('players', JSON.stringify(players));
                localStorage.setItem('matches', JSON.stringify(matches));
                renderTable();
                $('#score-input').val('');
            }
        });

        // Hàm xóa toàn bộ dữ liệu (dùng chung)
        function confirmAndResetData() {
            if (players.length === 0 && matches.length === 0) {
                Swal.fire({
                    icon: 'info',
                    title: 'Không có dữ liệu',
                    text: 'Không có dữ liệu để xóa!'
                });
                return;
            }

            Swal.fire({
                title: 'Xác nhận xóa dữ liệu?',
                text: "Bạn sẽ không thể hoàn tác sau khi xóa!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#6b7280',
                confirmButtonText: 'Xóa dữ liệu',
                cancelButtonText: 'Hủy bỏ'
            }).then((result) => {
                if (result.isConfirmed) {
                    localStorage.removeItem('players');
                    localStorage.removeItem('matches');
                    players = [];
                    matches = [];
                    renderTable();
                    Swal.fire(
                        'Đã xóa!',
                        'Tất cả dữ liệu đã bị xóa.',
                        'success'
                    )
                }
            })
        }

        // Xử lý nút xem lịch sử
        $('#history-button').click(function () {
            if (matches.length === 0) {
                Swal.fire({
                    icon: 'info',
                    title: 'Lịch sử trống',
                    text: 'Chưa có lịch sử đấu nào được ghi lại!'
                });
                return;
            }

            // Tập hợp tất cả tên người chơi xuất hiện trong các trận (giữ thứ tự xuất hiện)
            var playerNames = [];
            var seen = {};
            players.forEach(function (p) {
                if (!seen[p.name]) {
                    seen[p.name] = true;
                    playerNames.push(p.name);
                }
            });
            matches.forEach(function (m) {
                m.players.forEach(function (p) {
                    if (!seen[p.name]) {
                        seen[p.name] = true;
                        playerNames.push(p.name);
                    }
                });
            });

            // Tính tổng điểm theo tên
            var totals = {};
            playerNames.forEach(function (n) {
                totals[n] = 0;
            });
            matches.forEach(function (m) {
                m.players.forEach(function (p) {
                    totals[p.name] = (totals[p.name] || 0) + p.score;
                });
            });

            function pad2(n) {
                return n < 10 ? '0' + n : '' + n;
            }

            function formatHistoryTime(ts) {
                var d = new Date(ts);
                return pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) +
                    ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
            }

            function formatScore(value) {
                if (value > 0) return '+' + value;
                return String(value);
            }

            function scoreClass(value) {
                if (value > 0) return 'score-positive';
                if (value < 0) return 'score-negative';
                return 'score-zero';
            }

            // Dòng đầu: tổng điểm (hiển thị như header tóm tắt, sticky)
            function buildTotalRow() {
                var row = '<tr class="history-total-row">';
                row += '<td class="total-label" colspan="2">Tổng điểm</td>';
                playerNames.forEach(function (n) {
                    var total = totals[n] || 0;
                    row += '<td class="score-cell ' + scoreClass(total) + '">' + formatScore(total) + '</td>';
                });
                row += '</tr>';
                return row;
            }

            // Hàm dựng phần thân bảng theo thứ tự sắp xếp ('desc' = mới nhất trước)
            function buildHistoryRows(order) {
                var rows = buildTotalRow();

                var indices = matches.map(function (_, idx) { return idx; });
                if (order === 'desc') {
                    indices.reverse();
                }

                indices.forEach(function (idx) {
                    var match = matches[idx];
                    var timestamp = formatHistoryTime(match.timestamp);
                    var scoreByName = {};
                    var maxScore = -Infinity;
                    match.players.forEach(function (p) {
                        scoreByName[p.name] = p.score;
                        if (p.score > maxScore) maxScore = p.score;
                    });

                    rows += '<tr>';
                    rows += '<td class="col-stt">#' + (idx + 1) + '</td>';
                    rows += '<td class="col-time">' + timestamp + '</td>';
                    playerNames.forEach(function (n) {
                        if (scoreByName.hasOwnProperty(n)) {
                            var s = scoreByName[n];
                            var cls = 'score-cell ' + scoreClass(s);
                            if (s === maxScore && s > 0) cls += ' winner-cell';
                            rows += '<td class="' + cls + '">' + formatScore(s) + '</td>';
                        } else {
                            rows += '<td class="score-empty">—</td>';
                        }
                    });
                    rows += '</tr>';
                });

                return rows;
            }

            var html = '';
            html += '<div class="history-toolbar">';
            html += '<div class="history-stats"><strong>' + matches.length + '</strong> trận · <strong>' + playerNames.length + '</strong> người chơi</div>';
            html += '<div class="history-sort-group" role="group" aria-label="Sắp xếp">';
            html += '<button type="button" id="history-sort-desc" class="active">Mới nhất</button>';
            html += '<button type="button" id="history-sort-asc">Cũ nhất</button>';
            html += '</div></div>';
            html += '<div class="history-table-wrapper">';
            html += '<table class="history-table">';
            html += '<thead><tr>';
            html += '<th class="col-stt">#</th>';
            html += '<th class="col-time">Thời gian</th>';
            playerNames.forEach(function (n) {
                html += '<th>' + n + '</th>';
            });
            html += '</tr></thead>';
            html += '<tbody id="history-tbody">';
            html += buildHistoryRows('desc');
            html += '</tbody></table></div>';
            html += '<div class="history-actions">';
            html += '<button id="history-reset-button" class="btn btn-danger">';
            html += '<i class="fas fa-trash-alt"></i> Xóa Điểm';
            html += '</button></div>';

            Swal.fire({
                title: 'Lịch Sử Đấu',
                html: html,
                width: '820px',
                showConfirmButton: false,
                showCloseButton: true,
                didOpen: function () {
                    $('#history-reset-button').on('click', function () {
                        Swal.close();
                        confirmAndResetData();
                    });

                    function setSort(order) {
                        $('#history-tbody').html(buildHistoryRows(order));
                        if (order === 'desc') {
                            $('#history-sort-desc').addClass('active');
                            $('#history-sort-asc').removeClass('active');
                        } else {
                            $('#history-sort-asc').addClass('active');
                            $('#history-sort-desc').removeClass('active');
                        }
                    }

                    $('#history-sort-desc').on('click', function () { setSort('desc'); });
                    $('#history-sort-asc').on('click', function () { setSort('asc'); });
                }
            });
        });

        // Xử lý nút chia tiền
        $('#split-button').click(function () {
            if (players.length === 0) {
                Swal.fire({
                    icon: 'info',
                    title: 'Không có dữ liệu',
                    text: 'Vui lòng thêm người chơi trước khi chia tiền!'
                });
                return;
            }

            var debtors = [];
            var creditors = [];
            var totalPoints = 0;

            // Tạo bản sao danh sách người chơi để không thay đổi điểm gốc
            var playersCopy = players.map(function (player) {
                return {name: player.name, score: player.score};
            });

            // Phân loại người trả nợ và người nhận nợ
            playersCopy.forEach(function (player) {
                totalPoints += player.score;
                if (player.score < 0) {
                    debtors.push(player);
                } else if (player.score > 0) {
                    creditors.push(player);
                }
            });

            if (Math.abs(totalPoints) > 0.01) {
                Swal.fire({
                    icon: 'error',
                    title: 'Không thể chia tiền!',
                    text: 'Tổng điểm không phải là 0 (hiện tại là ' + totalPoints + '). Vui lòng kiểm tra lại.',
                });
                return;
            }

            // Nếu không có ai nợ hoặc không ai được nợ
            if (debtors.length === 0 || creditors.length === 0) {
                Swal.fire({
                    icon: 'info',
                    title: 'Không cần chia tiền',
                    text: 'Tất cả người chơi đều đang hòa (0 điểm) hoặc đều đang cùng nợ/được nợ.'
                });
                return;
            }

            // Tính toán các giao dịch chia tiền
            var transactions = [];
            var i = 0;
            var j = 0;

            while (i < debtors.length && j < creditors.length) {
                var debtor = debtors[i];
                var creditor = creditors[j];
                var transferAmount = Math.min(Math.abs(debtor.score), creditor.score);

                if (transferAmount > 0) {
                    transactions.push({
                        from: debtor.name,
                        to: creditor.name,
                        amount: transferAmount
                    });
                }

                // Cập nhật số tiền còn lại
                debtor.score += transferAmount;
                creditor.score -= transferAmount;

                // Chuyển sang người tiếp theo nếu đã giải quyết xong
                if (Math.abs(debtor.score) < 0.01) {
                    i++;
                }
                if (Math.abs(creditor.score) < 0.01) {
                    j++;
                }
            }

            // Tạo HTML cho kết quả chia tiền
            var html = '<div class="split-result">';

            if (transactions.length === 0) {
                html += '<p class="text-center">Không có giao dịch nào cần thực hiện.</p>';
            } else {
                html += '<table class="table table-hover transaction-table">';
                html += '<thead class="table-primary"><tr><th>Người trả</th><th></th><th>Người nhận</th><th>Số tiền</th></tr></thead>';
                html += '<tbody>';

                for (var t = 0; t < transactions.length; t++) {
                    var transaction = transactions[t];
                    html += `<tr>
                            <td><strong>${transaction.from}</strong></td>
                            <td><i class="fas fa-arrow-right text-primary"></i></td>
                            <td><strong>${transaction.to}</strong></td>
                            <td><span class="badge bg-success">${transaction.amount}</span></td>
                        </tr>`;
                }

                html += '</tbody></table>';
            }

            html += '</div>';

            Swal.fire({
                title: 'Kết Quả Chia Tiền',
                html: html,
                width: '600px'
            });
        });

        // Xử lý nút chia sẻ
        $('#share-button').click(function () {
            if (players.length === 0) {
                Swal.fire({
                    icon: 'info',
                    title: 'Không có dữ liệu',
                    text: 'Vui lòng thêm người chơi trước khi chia sẻ!'
                });
                return;
            }

            // Tạo đối tượng chứa dữ liệu cần chia sẻ
            const shareData = {
                players: players,
                matches: matches
            };

            // Chuyển đối tượng thành chuỗi JSON
            const jsonData = JSON.stringify(shareData);

            // Mã hóa dữ liệu bằng LZString
            const compressedData = LZString.compressToEncodedURIComponent(jsonData);

            // Tạo URL chia sẻ
            const shareUrl = window.location.origin + window.location.pathname + '?data=' + compressedData;

            // Tạo một textarea ẩn để copy URL
            const textarea = document.createElement('textarea');
            textarea.value = shareUrl;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);

            // Hiển thị thông báo đã copy
            Swal.fire({
                title: 'Đã sao chép link!',
                html: `
            <p>Link chia sẻ đã được sao chép vào clipboard.</p>
            <div class="input-group mt-3">
                <input type="text" class="form-control" value="${shareUrl}" readonly>
                <button class="btn btn-outline-primary" type="button" onclick="window.open('${shareUrl}', '_blank')">
                    <i class="fas fa-external-link-alt"></i>
                </button>
            </div>
        `,
                icon: 'success'
            });
        });

        // Xử lý nút chuyển đổi giao diện sáng/tối
        $('#dark-mode-toggle').click(function () {
            $('body').toggleClass('dark-mode');
            updateThemeIcon();

            // Lưu trạng thái theme vào localStorage
            if ($('body').hasClass('dark-mode')) {
                localStorage.setItem('theme', 'dark');
            } else {
                localStorage.setItem('theme', 'light');
            }
        });

        // Kiểm tra và áp dụng theme đã lưu
        function applyTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                $('body').addClass('dark-mode');
            }
            updateThemeIcon();
        }

        // Cập nhật icon theo theme
        function updateThemeIcon() {
            if ($('body').hasClass('dark-mode')) {
                $('#dark-mode-toggle i').removeClass('fa-moon').addClass('fa-sun');
            } else {
                $('#dark-mode-toggle i').removeClass('fa-sun').addClass('fa-moon');
            }
        }

        // Hiển thị bảng điểm
        function renderTable() {
            $('#score-table').empty();

            if (players.length === 0) {
                $('#player-table').hide();
                $('#empty-state').show();
                return;
            }

            $('#empty-state').hide();
            $('#player-table').show();

            // Tìm người chơi có điểm thấp nhất
            let lowestScore = Infinity;

            players.forEach(function (player, index) {
                if (player.score < lowestScore && player.score !== 0) {
                    lowestScore = player.score;
                }
            });

            players.forEach(function (player, index) {
                var scoreClass = player.score > 0 ? 'positive-score' : player.score < 0 ? 'negative-score' : '';
                var tr = $('<tr>');

                // Thêm lớp font-weight-bold nếu là người chơi có điểm thấp nhất
                if (player.score === lowestScore) {
                    tr.addClass('fw-bold negative-score');
                }

                tr.append($('<td>').text(player.name));
                tr.append($('<td>').addClass(scoreClass).text(player.score));
                $('#score-table').append(tr);
            });
        }

        // Tính tổng các giá trị số
        function sumNumericValues(values) {
            let sum = 0;
            for (let i = 0; i < values.length; i++) {
                const value = values[i].trim();
                if (value !== '-' && !isNaN(Number(value))) {
                    sum += Number(value);
                }
            }
            return sum;
        }

        // Kiểm tra dữ liệu đầu vào hợp lệ
        function validateInput(inputString) {
            // Kiểm tra định dạng hợp lệ (chỉ cho phép số, dấu phẩy, dấu gạch ngang và khoảng trắng)
            var regex = /^[\d,-\s]+$/;

            // Kiểm tra xem có ít nhất một dấu '-' không
            var hasNegativeSign = inputString.includes('-');

            return regex.test(inputString) && hasNegativeSign;
        }

        // Áp dụng theme khi tải trang
        applyTheme();
    });
</script>
</body>
</html>
